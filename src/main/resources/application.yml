spring:
  application:
    name: commerce-platform
  profiles:
    default: local

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.wakalueng.commerce: ${APP_LOG_LEVEL:INFO}
